<style>
/* =========================================================
   IPTV WEB PLAYER - BLOGGER
   ========================================================= */

#iptvApp {
    --bg: #080b10;
    --panel: #11161d;
    --panel2: #181f28;
    --border: #252d38;
    --text: #f5f7fa;
    --muted: #8993a1;
    --accent: #e50914;

    background: var(--bg);
    color: var(--text);
    min-height: 700px;
    width: 100%;
    font-family: Arial, Helvetica, sans-serif;
    box-sizing: border-box;
    overflow: hidden;
}

#iptvApp * {
    box-sizing: border-box;
}

.iptv-header {
    padding: 18px;
    background: linear-gradient(180deg, #11161d, #080b10);
    border-bottom: 1px solid var(--border);
}

.iptv-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 15px;
}

.iptv-live {
    background: var(--accent);
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 11px;
    letter-spacing: .5px;
}

.iptv-search {
    width: 100%;
    padding: 13px 15px;
    background: #080b10;
    border: 1px solid var(--border);
    color: white;
    border-radius: 8px;
    outline: none;
    font-size: 15px;
}

.iptv-search:focus {
    border-color: var(--accent);
}

.iptv-layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 650px;
}

.iptv-sidebar {
    background: #0d1218;
    border-right: 1px solid var(--border);
    padding: 15px 10px;
}

.iptv-sidebar-title {
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    padding: 8px;
}

.iptv-category {
    display: block;
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 4px;
    background: transparent;
    border: 0;
    color: #cbd2da;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

.iptv-category:hover,
.iptv-category.active {
    background: var(--panel2);
    color: white;
}

.iptv-content {
    padding: 18px;
}

.iptv-player {
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid var(--border);
}

#iptvVideo {
    display: block;
    width: 100%;
    max-height: 500px;
    background: #000;
}

.iptv-now {
    padding: 12px 15px;
    background: #11161d;
    border-top: 1px solid var(--border);
    font-size: 14px;
}

.iptv-now span {
    color: var(--muted);
}

.iptv-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
}

.iptv-channel {
    position: relative;
    min-height: 145px;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 9px;
    cursor: pointer;
    transition: .15s;
}

.iptv-channel:hover {
    transform: translateY(-2px);
    background: var(--panel2);
    border-color: #3a4553;
}

.iptv-logo {
    height: 75px;
    width: 100%;
    object-fit: contain;
    margin-bottom: 10px;
}

.iptv-channel-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
    font-weight: 600;
}

.iptv-channel-group {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
}

.iptv-fav {
    position: absolute;
    right: 8px;
    top: 8px;
    border: 0;
    background: rgba(0,0,0,.65);
    color: #777;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    z-index: 2;
}

.iptv-fav.active {
    color: #ffd21c;
}

.iptv-status {
    padding: 30px;
    text-align: center;
    color: var(--muted);
}

.iptv-loading {
    color: white;
}

.iptv-error {
    color: #ff7070;
}

.iptv-count {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 15px;
}

/* MOBILE */

@media (max-width: 700px) {

    .iptv-layout {
        display: block;
    }

    .iptv-sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        white-space: nowrap;
        padding: 8px;
    }

    .iptv-sidebar-title {
        display: none;
    }

    .iptv-category {
        display: inline-block;
        width: auto;
        margin-right: 4px;
    }

    .iptv-content {
        padding: 10px;
    }

    .iptv-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .iptv-channel {
        min-height: 130px;
    }

    #iptvVideo {
        max-height: 260px;
    }
}
</style>


<div id="iptvApp">

    <div class="iptv-header">

        <div class="iptv-title">
            <span class="iptv-live">LIVE</span>
            Meu IPTV
        </div>

        <input
            id="iptvSearch"
            class="iptv-search"
            type="search"
            placeholder="🔎 Pesquisar canal..."
        >

    </div>


    <div class="iptv-layout">

        <aside class="iptv-sidebar">

            <div class="iptv-sidebar-title">
                Categorias
            </div>

            <button
                class="iptv-category active"
                data-category="TODOS">
                Todos
            </button>

            <button
                class="iptv-category"
                data-category="FAVORITOS">
                ⭐ Favoritos
            </button>

            <div id="iptvCategories"></div>

        </aside>


        <main class="iptv-content">

            <div class="iptv-player">

                <video
                    id="iptvVideo"
                    controls
                    playsinline
                    preload="metadata">
                </video>

                <div class="iptv-now">
                    <span>Assistindo:</span>
                    <strong id="iptvCurrent">
                        Selecione um canal
                    </strong>
                </div>

            </div>


            <div id="iptvCount" class="iptv-count">
                Carregando...
            </div>


            <div id="iptvGrid" class="iptv-grid">

                <div class="iptv-status iptv-loading">
                    Carregando canais...
                </div>

            </div>

        </main>

    </div>

</div>


<!-- HLS.JS -->

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>


<script>
(function () {

    "use strict";


    /* =====================================================
       CONFIGURAÇÃO
       ===================================================== */

    const PLAYLIST_URL =
        "https://raw.githubusercontent.com/leonardo20188/user/main/iptv.bylr";


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const app = document.getElementById("iptvApp");
    const grid = document.getElementById("iptvGrid");
    const categoriesBox = document.getElementById("iptvCategories");
    const search = document.getElementById("iptvSearch");
    const video = document.getElementById("iptvVideo");
    const current = document.getElementById("iptvCurrent");
    const count = document.getElementById("iptvCount");


    let channels = [];
    let selectedCategory = "TODOS";
    let hls = null;


    /* =====================================================
       FAVORITOS
       ===================================================== */

    function getFavorites() {

        try {

            return JSON.parse(
                localStorage.getItem("meuIPTV_favoritos") || "[]"
            );

        } catch (e) {

            return [];

        }

    }


    function saveFavorites(favorites) {

        localStorage.setItem(
            "meuIPTV_favoritos",
            JSON.stringify(favorites)
        );

    }


    function isFavorite(url) {

        return getFavorites().includes(url);

    }


    function toggleFavorite(url) {

        let favorites = getFavorites();

        if (favorites.includes(url)) {

            favorites = favorites.filter(
                item => item !== url
            );

        } else {

            favorites.push(url);

        }

        saveFavorites(favorites);

        renderChannels();

    }


    /* =====================================================
       LIMPAR HTML
       ===================================================== */

    function escapeHTML(text) {

        return String(text || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =====================================================
       PARSER M3U
       ===================================================== */

    function parseM3U(text) {

        const lines = text
            .replace(/\r/g, "")
            .split("\n")
            .map(line => line.trim())
            .filter(Boolean);

        const result = [];

        let info = null;


        for (let i = 0; i < lines.length; i++) {

            const line = lines[i];


            if (line.startsWith("#EXTINF")) {

                info = line;

                continue;

            }


            if (
                info &&
                !line.startsWith("#") &&
                /^https?:\/\//i.test(line)
            ) {

                const namePart =
                    info.substring(info.lastIndexOf(",") + 1).trim();


                const groupMatch =
                    info.match(/group-title="([^"]*)"/i);

                const logoMatch =
                    info.match(/tvg-logo="([^"]*)"/i);

                const idMatch =
                    info.match(/tvg-id="([^"]*)"/i);


                const group =
                    groupMatch
                        ? groupMatch[1]
                        : "Outros";


                const logo =
                    logoMatch
                        ? logoMatch[1]
                        : "";


                const id =
                    idMatch
                        ? idMatch[1]
                        : "";


                result.push({

                    name:
                        namePart || "Canal",

                    url:
                        line,

                    group:
                        group || "Outros",

                    logo:
                        logo,

                    id:
                        id

                });


                info = null;

            }

        }


        return result;

    }


    /* =====================================================
       CATEGORIAS
       ===================================================== */

    function renderCategories() {

        const categories = [...new Set(
            channels
                .map(channel => channel.group)
                .filter(Boolean)
        )].sort();


        categoriesBox.innerHTML = "";


        categories.forEach(category => {

            const button =
                document.createElement("button");

            button.className = "iptv-category";

            button.dataset.category = category;

            button.textContent = category;


            button.onclick = function () {

                selectedCategory = category;

                updateCategoryButtons();

                renderChannels();

            };


            categoriesBox.appendChild(button);

        });

    }


    function updateCategoryButtons() {

        document
            .querySelectorAll(".iptv-category")
            .forEach(button => {

                button.classList.toggle(
                    "active",
                    button.dataset.category === selectedCategory
                );

            });

    }


    /* =====================================================
       FILTRO
       ===================================================== */

    function getFilteredChannels() {

        const term =
            search.value
                .toLowerCase()
                .trim();


        return channels.filter(channel => {

            const matchesSearch =
                !term ||
                channel.name
                    .toLowerCase()
                    .includes(term) ||
                channel.group
                    .toLowerCase()
                    .includes(term);


            let matchesCategory = true;


            if (selectedCategory === "FAVORITOS") {

                matchesCategory =
                    isFavorite(channel.url);

            } else if (
                selectedCategory !== "TODOS"
            ) {

                matchesCategory =
                    channel.group === selectedCategory;

            }


            return matchesSearch && matchesCategory;

        });

    }


    /* =====================================================
       RENDERIZAÇÃO
       ===================================================== */

    function renderChannels() {

        const filtered =
            getFilteredChannels();


        count.textContent =
            filtered.length +
            " canal" +
            (filtered.length === 1 ? "" : "is");


        if (!filtered.length) {

            grid.innerHTML =
                '<div class="iptv-status">' +
                'Nenhum canal encontrado.' +
                '</div>';

            return;

        }


        grid.innerHTML = "";


        filtered.forEach(channel => {

            const card =
                document.createElement("div");

            card.className =
                "iptv-channel";


            const favorite =
                document.createElement("button");

            favorite.className =
                "iptv-fav" +
                (isFavorite(channel.url)
                    ? " active"
                    : "");

            favorite.innerHTML =
                isFavorite(channel.url)
                    ? "★"
                    : "☆";


            favorite.title =
                "Adicionar/remover favorito";


            favorite.onclick =
                function (event) {

                    event.stopPropagation();

                    toggleFavorite(channel.url);

                };


            card.appendChild(favorite);


            const logo =
                document.createElement("img");

            logo.className =
                "iptv-logo";


            if (channel.logo) {

                logo.src = channel.logo;

                logo.onerror =
                    function () {

                        this.style.display =
                            "none";

                    };

            } else {

                logo.style.display =
                    "none";

            }


            card.appendChild(logo);


            const name =
                document.createElement("div");

            name.className =
                "iptv-channel-name";

            name.textContent =
                channel.name;


            card.appendChild(name);


            const group =
                document.createElement("div");

            group.className =
                "iptv-channel-group";

            group.textContent =
                channel.group;


            card.appendChild(group);


            card.onclick =
                function () {

                    playChannel(channel);

                };


            grid.appendChild(card);

        });

    }


    /* =====================================================
       PLAYER
       ===================================================== */

    function playChannel(channel) {

        current.textContent =
            channel.name;


        if (hls) {

            try {

                hls.destroy();

            } catch (e) {}

            hls = null;

        }


        video.pause();

        video.removeAttribute("src");

        video.load();


        const url =
            channel.url;


        /*
         * HLS
         */

        if (
            window.Hls &&
            Hls.isSupported()
        ) {

            hls = new Hls({

                enableWorker: true,

                lowLatencyMode: true

            });


            hls.loadSource(url);

            hls.attachMedia(video);


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function () {

                    video.play().catch(
                        function () {}
                    );

                }
            );


            hls.on(
                Hls.Events.ERROR,
                function (
                    event,
                    data
                ) {

                    if (
                        data.fatal
                    ) {

                        console.warn(
                            "Erro no stream:",
                            data
                        );

                    }

                }
            );


        } else {

            /*
             * Safari / players nativos
             */

            video.src = url;

            video.play().catch(
                function () {}
            );

        }

    }


    /* =====================================================
       BUSCA
       ===================================================== */

    search.addEventListener(
        "input",
        function () {

            renderChannels();

        }
    );


    /* =====================================================
       BOTÕES INICIAIS
       ===================================================== */

    document
        .querySelector(
            '[data-category="TODOS"]'
        )
        .onclick = function () {

            selectedCategory =
                "TODOS";

            updateCategoryButtons();

            renderChannels();

        };


    document
        .querySelector(
            '[data-category="FAVORITOS"]'
        )
        .onclick = function () {

            selectedCategory =
                "FAVORITOS";

            updateCategoryButtons();

            renderChannels();

        };


    /* =====================================================
       CARREGAR PLAYLIST
       ===================================================== */

    async function loadPlaylist() {

        try {

            const response =
                await fetch(
                    PLAYLIST_URL,
                    {
                        cache: "no-cache"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const text =
                await response.text();


            channels =
                parseM3U(text);


            if (!channels.length) {

                throw new Error(
                    "Nenhum canal encontrado na playlist."
                );

            }


            renderCategories();

            renderChannels();


        } catch (error) {

            console.error(error);


            grid.innerHTML =
                '<div class="iptv-status iptv-error">' +
                '<strong>Não foi possível carregar a playlist.</strong>' +
                '<br><br>' +
                'Verifique se a URL está acessível e se o servidor permite CORS.' +
                '</div>';


            count.textContent =
                "Erro ao carregar";

        }

    }


    loadPlaylist();


})();
</script>
