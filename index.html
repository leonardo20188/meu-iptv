<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #090909;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    background: #151515;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #292929;
}

.logo-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 12px;
}

#search {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

#categories {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 12px;
    padding-bottom: 3px;
}

.category {
    background: #292929;
    color: white;
    border: 0;
    border-radius: 20px;
    padding: 9px 15px;
    white-space: nowrap;
    cursor: pointer;
}

.category.active {
    background: #e50914;
}

main {
    padding: 15px;
}

.player-box {
    max-width: 1000px;
    height: 520px;
    margin: auto;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
}

.player-message {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px;
    color: #aaa;
    background: #000;
    pointer-events: none;
}

.player-message.hidden {
    display: none;
}

.status {
    max-width: 1000px;
    margin: 12px auto;
    padding: 12px;
    border-radius: 8px;
    background: #171717;
    color: #aaa;
    font-size: 13px;
}

.channels {
    max-width: 1200px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}

.channel {
    background: #171717;
    border: 1px solid #252525;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
    transition: .2s;
}

.channel:hover {
    background: #222;
    transform: translateY(-2px);
}

.channel img {
    width: 100%;
    height: 90px;
    object-fit: contain;
    background: #0c0c0c;
    border-radius: 7px;
    margin-bottom: 8px;
}

.channel-name {
    font-weight: bold;
    font-size: 14px;
}

.channel-group {
    color: #888;
    font-size: 12px;
    margin-top: 5px;
}

.loading {
    text-align: center;
    color: #999;
    padding: 30px;
}

@media (max-width: 600px) {

    .player-box {
        height: 250px;
    }

    .channels {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    .channel {
        padding: 8px;
    }

    .channel img {
        height: 65px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo-title">
📺 Meu IPTV
</div>

<input
    id="search"
    type="text"
    placeholder="🔎 Pesquisar canal..."
>

<div id="categories"></div>

</header>

<main>

<div class="player-box">

    <video
        id="video"
        controls
        playsinline
        preload="auto">
    </video>

    <div
        id="playerMessage"
        class="player-message">
        Selecione um canal para começar
    </div>

</div>

<div id="status" class="status">
    Carregando playlist...
</div>

<div
    id="channels"
    class="channels">

    <div class="loading">
        Carregando canais...
    </div>

</div>

</main>

<script>

const PLAYLIST_URL =
"https://raw.githubusercontent.com/leonardo20188/user/main/iptv.bylr";

let channels = [];
let currentCategory = "Todos";
let hls = null;


/* =========================
   ELEMENTOS
========================= */

const video =
    document.getElementById("video");

const status =
    document.getElementById("status");

const channelsContainer =
    document.getElementById("channels");

const categoriesContainer =
    document.getElementById("categories");

const playerMessage =
    document.getElementById("playerMessage");


/* =========================
   CARREGAR PLAYLIST
========================= */

async function loadPlaylist() {

    try {

        status.textContent =
            "Baixando playlist...";

        const response =
            await fetch(PLAYLIST_URL, {
                cache: "no-cache"
            });

        if (!response.ok) {
            throw new Error(
                "Não foi possível acessar a playlist."
            );
        }

        const text =
            await response.text();

        parsePlaylist(text);

        createCategories();

        renderChannels();

        status.textContent =
            channels.length +
            " canais encontrados.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ Erro ao carregar a playlist.";

        channelsContainer.innerHTML = `
            <div class="loading">
                Não foi possível carregar os canais.
            </div>
        `;
    }
}


/* =========================
   PARSER M3U
========================= */

function parsePlaylist(text) {

    const lines =
        text.split(/\r?\n/);

    channels = [];

    for (
        let i = 0;
        i < lines.length;
        i++
    ) {

        const line =
            lines[i].trim();

        if (
            !line.startsWith("#EXTINF")
        ) {
            continue;
        }

        const url =
            lines[i + 1]
            ? lines[i + 1].trim()
            : "";

        if (
            !url ||
            url.startsWith("#")
        ) {
            continue;
        }

        const comma =
            line.lastIndexOf(",");

        const name =
            comma >= 0
            ? line.substring(comma + 1).trim()
            : "Canal";

        const logoMatch =
            line.match(
                /tvg-logo="([^"]*)"/i
            );

        const groupMatch =
            line.match(
                /group-title="([^"]*)"/i
            );

        channels.push({

            name: name,

            url: url,

            logo:
                logoMatch
                ? logoMatch[1]
                : "",

            group:
                groupMatch
                ? groupMatch[1]
                : "Outros"

        });
    }
}


/* =========================
   CATEGORIAS
========================= */

function createCategories() {

    categoriesContainer.innerHTML = "";

    const groups = [
        "Todos",
        ...new Set(
            channels.map(
                channel => channel.group
            )
        )
    ];

    groups.forEach(group => {

        const button =
            document.createElement("button");

        button.className =
            "category" +
            (
                group === "Todos"
                ? " active"
                : ""
            );

        button.textContent = group;

        button.onclick = function() {

            currentCategory = group;

            document
                .querySelectorAll(".category")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            button.classList.add("active");

            renderChannels();
        };

        categoriesContainer
            .appendChild(button);
    });
}


/* =========================
   RENDER CANAIS
========================= */

function renderChannels() {

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    channelsContainer.innerHTML = "";

    const filtered =
        channels.filter(channel => {

            const categoryOK =
                currentCategory === "Todos" ||
                channel.group === currentCategory;

            const searchOK =
                channel.name
                .toLowerCase()
                .includes(search);

            return categoryOK && searchOK;
        });

    if (!filtered.length) {

        channelsContainer.innerHTML = `
            <div class="loading">
                Nenhum canal encontrado.
            </div>
        `;

        return;
    }

    filtered.forEach(channel => {

        const card =
            document.createElement("div");

        card.className = "channel";

        const image =
            channel.logo
            ? `
                <img
                    src="${escapeHTML(channel.logo)}"
                    onerror="this.style.display='none'"
                >
              `
            : `
                <div
                    style="
                    height:90px;
                    background:#0c0c0c;
                    border-radius:7px;
                    margin-bottom:8px;">
                </div>
              `;

        card.innerHTML = `

            ${image}

            <div class="channel-name">
                ${escapeHTML(channel.name)}
            </div>

            <div class="channel-group">
                ${escapeHTML(channel.group)}
            </div>

        `;

        card.onclick = () =>
            playChannel(channel);

        channelsContainer
            .appendChild(card);
    });
}


/* =========================
   REPRODUZIR
========================= */

function playChannel(channel) {

    stopPlayer();

    playerMessage.classList.add("hidden");

    status.textContent =
        "Abrindo: " + channel.name;


    /*
     * IMPORTANTE:
     * Sua playlist contém URLs HTTP.
     * O GitHub Pages usa HTTPS.
     * O navegador pode bloquear HTTP.
     */

    if (
        channel.url
        .toLowerCase()
        .startsWith("http://")
    ) {

        playerMessage.innerHTML = `
            <div>
                <h3>⚠️ Canal bloqueado pelo navegador</h3>

                <p>
                    Este canal utiliza HTTP,
                    enquanto este site está em HTTPS.
                </p>

                <p>
                    O servidor do canal precisa
                    disponibilizar HTTPS para funcionar
                    diretamente no navegador.
                </p>
            </div>
        `;

        playerMessage.classList.remove("hidden");

        status.textContent =
            "⚠️ " +
            channel.name +
            " usa HTTP e pode ser bloqueado pelo navegador.";

        return;
    }


    /*
     * HLS.JS
     */

    if (
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: true,

                backBufferLength: 90

            });

        hls.loadSource(
            channel.url
        );

        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function() {

                status.textContent =
                    "▶️ Reproduzindo: " +
                    channel.name;

                video.play()
                    .catch(() => {});
            }
        );

        hls.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ) {

                console.error(
                    "HLS ERROR:",
                    data
                );

                if (
                    data.fatal
                ) {

                    status.textContent =
                        "❌ O servidor não permitiu a reprodução deste canal.";

                    playerMessage.innerHTML = `
                        <div>
                            <h3>❌ Não foi possível reproduzir</h3>

                            <p>
                                O servidor do canal pode
                                estar bloqueando reprodução
                                pelo navegador (CORS),
                                estar offline ou exigir
                                outro tipo de acesso.
                            </p>
                        </div>
                    `;

                    playerMessage
                        .classList
                        .remove("hidden");
                }
            }
        );

        return;
    }


    /*
     * Safari / navegadores com HLS nativo
     */

    if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src =
            channel.url;

        video.play()
            .catch(() => {});

        status.textContent =
            "▶️ Reproduzindo: " +
            channel.name;

        return;
    }


    status.textContent =
        "❌ Este navegador não suporta HLS.";
}


/* =========================
   PARAR PLAYER
========================= */

function stopPlayer() {

    if (hls) {

        hls.destroy();

        hls = null;
    }

    video.pause();

    video.removeAttribute("src");

    video.load();
}


/* =========================
   PESQUISA
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderChannels
    );


/* =========================
   ESCAPAR HTML
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   INICIAR
========================= */

loadPlaylist();

</script>

</body>
</html>
